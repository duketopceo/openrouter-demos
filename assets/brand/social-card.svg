<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="OpenRouter Demos social card">
  <title>OpenRouter Demos social card (proposal)</title>
  <rect width="1280" height="640" fill="#0E1116"/>
  <g transform="translate(96 96) scale(5)">
    <rect width="32" height="32" rx="7" fill="#151B23" stroke="#2A3441" stroke-width="0.6"/>
    <g fill="none" stroke="#D5DDE8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 16H13L18.5 9H22"/><path d="M13 16L18.5 23H22"/>
    </g>
    <circle cx="7" cy="16" r="2.2" fill="#D5DDE8"/>
    <circle cx="25" cy="9" r="3" fill="#3ECFB0"/>
    <circle cx="25" cy="23" r="2.4" fill="none" stroke="#8D99A8" stroke-width="1.8"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
