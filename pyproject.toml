[project]
name = "openrouter-demos"
version = "0.1.0"
description = "Three RouteKit demos on OpenRouter: support deflection, GTM motion, provider bakeoff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
